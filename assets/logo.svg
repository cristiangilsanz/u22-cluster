<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-20 -20 320 280" width="320" height="280">
  <defs>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6a46b"/>
      <stop offset="1" stop-color="#b44c9f"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb380"/>
      <stop offset="1" stop-color="#f07a3c"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e95420"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a23b8f"/>
      <stop offset="1" stop-color="#5e2750"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="cube">
      <path d="M0 -34 L29 -17 L0 0 L-29 -17 Z" fill="url(#top)"/>
      <path d="M-29 -17 L0 0 L0 34 L-29 17 Z" fill="url(#left)"/>
      <path d="M0 0 L29 -17 L29 17 L0 34 Z" fill="url(#right)"/>
      <path d="M0 -34 L29 -17 L29 17 L0 34 L-29 17 L-29 -17 Z M0 0 L0 34 M0 0 L-29 -17 M0 0 L29 -17"
            fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <path id="ab" d="M140 52 L56 186"/>
    <path id="bc" d="M56 186 L224 186"/>
    <path id="ca" d="M224 186 L140 52"/>
  </defs>

  <g stroke="url(#link)" stroke-linecap="round" fill="none">
    <path d="M140 52 L56 186 L224 186 Z" stroke-width="16" opacity="0.15"/>
    <path d="M140 52 L56 186 L224 186 Z" stroke-width="5" filter="url(#glow)"/>
  </g>

  <g fill="#ffffff" stroke="#e95420" stroke-width="2" filter="url(#glow)" opacity="0">
    <set attributeName="opacity" to="1" begin="0s" fill="freeze"/>
    <circle r="5">
      <animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#ab"/></animateMotion>
    </circle>
    <circle r="5">
      <animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite"><mpath href="#bc"/></animateMotion>
    </circle>
    <circle r="5">
      <animateMotion dur="2.4s" begin="-0.8s" repeatCount="indefinite"><mpath href="#ca"/></animateMotion>
    </circle>
  </g>

  <g fill="none" stroke="#f07a3c" stroke-width="2">
    <circle cx="140" cy="52" r="40">
      <animate attributeName="r" values="40;58" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="56" cy="186" r="40">
      <animate attributeName="r" values="40;58" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="224" cy="186" r="40">
      <animate attributeName="r" values="40;58" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g filter="url(#glow)">
    <use href="#cube" xlink:href="#cube" x="140" y="52"/>
    <use href="#cube" xlink:href="#cube" x="56" y="186"/>
    <use href="#cube" xlink:href="#cube" x="224" y="186"/>
  </g>
</svg>
